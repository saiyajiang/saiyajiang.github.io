<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更新日志 · 悲歌的小站</title>
    <link rel="stylesheet" href="assets/style.v2.css">
</head>
<body>

    <!-- ==================== HEADER ==================== -->
    <header class="site-header" id="header">
        <div class="header-inner">
            <button class="menu-toggle" id="menuToggle" aria-label="菜单">
                <span></span><span></span><span></span>
            </button>
            <nav class="nav-menu" id="navMenu">
                <a href="index.html">~/blog</a>
                <a href="archive.html">~/archive</a>
                <a href="about.html">~/about</a>
                <a href="changelog.html">~/changelog</a>
            </nav>
            <button class="theme-toggle" id="themeToggle" aria-label="切换深色/亮色" title="切换主题">☀</button>
        </div>
    </header>

    <!-- ==================== 主体 ==================== -->
    <main class="page-content">

        <section class="page-card">
            <div class="card-header">$ git log --oneline</div>
            <div class="card-body">
                <div class="timeline" id="timelineList"></div>
            </div>
        </section>

    </main>

    <!-- ==================== FOOTER ==================== -->
    <footer class="site-footer">
        <div class="footer-inner">
            <span>$ echo "&copy; 2026 悲歌的小站 &middot; Powered by GitHub Pages"</span>
            <div class="footer-links">
                <a href="https://github.com/saiyajiang/saiyajiang.github.io" target="_blank">Source</a>
            </div>
        </div>
    </footer>

    <button class="back-to-top" id="backToTop" aria-label="返回顶部" title="返回顶部">cd /</button>

    <script src="assets/site.js"></script>
    <script>
    (function() {
        'use strict';

        var changelog = [
            {
                date: '2026-07-27',
                hash: 'abcd123',
                title: '全局音乐播放器重写为纯自定义组件',
                desc: '彻底弃用 APlayer/Meting.js 第三方库，改为纯原生 HTML + Audio API 实现的自定义播放器。新增功能：播放模式切换（顺序/循环全部/单曲循环/随机，单按钮循环）、音量滑块、可拖动定位、可展开播放列表。',
                tags: ['New', 'Feature', 'Fix', 'UI']
            },
            {
                date: '2026-07-26',
                hash: 'ef56789',
                title: 'TTS 进度条修复 + 全局音乐播放器',
                desc: '朗读进度条改为基于时间推算，解决长文本 boundary 事件不触发导致进度不动的问题；自动优选中文神经网络嗓音。新增全局音乐播放器（右下角），读取 assets/playlist.js 播放列表，支持跨页面续播。',
                tags: ['New', 'Fix']
            },
            {
                date: '2026-07-26',
                hash: '9012abc',
                title: '新增文字朗读功能（AI 读文字）',
                desc: '文章页新增浮动朗读控件，基于浏览器 Web Speech API（speechSynthesis）朗读中文全文，支持播放/暂停/继续、进度条与字符级进度。纯前端实现，无需密钥或后端，契合 GitHub Pages 静态限制。',
                tags: ['New', 'Feature']
            },
            {
                date: '2026-07-26',
                hash: '345def6',
                title: '新增文章：一生所爱（歌词）',
                desc: '新增《一生所爱》歌词页，收录电影《大话西游》片尾曲全文（唐书琛作词、卢冠廷作曲）。文章总数 7 篇、标签 15 个。',
                tags: ['New', 'Doc']
            },
            {
                date: '2026-07-25',
                hash: '789ghij',
                title: '数据驱动重构 + 首页统计修复 + 新增文章',
                desc: '全站重构：抽离共用 assets/style.v2.css"timeline-item">';
            html += '  <div class="timeline-commit">* <span class="hash">' + entry.hash + '</span> (' + entry.date + ') ' + entry.title + '</div>';
            if (entry.desc) {
                html += '  <div class="timeline-desc">' + entry.desc + '</div>';
            }
            html += '  <div class="timeline-tags">';
            entry.tags.forEach(function(tag) {
                html += '    <span class="timeline-tag">[' + tag + ']</span>';
            });
            html += '  </div>';
            html += '</div>';
        });

        document.getElementById('timelineList').innerHTML = html;
    })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更新日志 · 悲歌的小站</title>
    <link rel="stylesheet" href="assets/style.v2.css">
</head>
<body>

    <!-- ==================== HEADER ==================== -->
    <header class="site-header" id="header">
        <div class="header-inner">
            <button class="menu-toggle" id="menuToggle" aria-label="菜单">
                <span></span><span></span><span></span>
            </button>
            <nav class="nav-menu" id="navMenu">
                <a href="index.html">~/blog</a>
                <a href="archive.html">~/archive</a>
                <a href="about.html">~/about</a>
                <a href="changelog.html">~/changelog</a>
            </nav>
            <button class="theme-toggle" id="themeToggle" aria-label="切换深色/亮色" title="切换主题">☀</button>
        </div>
    </header>

    <!-- ==================== 主体 ==================== -->
    <main class="page-content">

        <section class="page-card">
            <div class="card-header">$ git log --oneline</div>
            <div class="card-body">
                <div class="timeline" id="timelineList"></div>
            </div>
        </section>

    </main>

    <!-- ==================== FOOTER ==================== -->
    <footer class="site-footer">
        <div class="footer-inner">
            <span>$ echo "&copy; 2026 悲歌的小站 &middot; Powered by GitHub Pages"</span>
            <div class="footer-links">
                <a href="https://github.com/saiyajiang/saiyajiang.github.io" target="_blank">Source</a>
            </div>
        </div>
    </footer>

    <button class="back-to-top" id="backToTop" aria-label="返回顶部" title="返回顶部">cd /</button>

    <script src="assets/site.js"></script>
    <script>
    (function() {
        'use strict';

        var changelog = [
            {
                date: '2026-07-28',
                hash: 'melodybox',
                title: '播放器独立发布：MelodyBox v1.0',
                desc: '将站内自定义音乐播放器提取为独立开源组件 MelodyBox。纯原生 JS + CSS，零依赖，支持顺序/循环/单曲循环/随机四种播放模式、音量滑块、播放列表、自由拖拽。附带完整 demo.html 和 README 使用文档。',
                tags: ['New', 'Feature']
            },
            {
                date: '2026-07-28',
                hash: '670cd70',
                title: '项目结构清理与规范',
                desc: '根目录整理：备份文件归入 .backup/、临时脚本归入 scripts/、过程文档归入 docs/。更新 .gitignore 规则。',
                tags: ['Fix']
            },
            {
                date: '2026-07-27',
                hash: 'abcd123',
                title: '全局音乐播放器重写为纯自定义组件',
                desc: '彻底弃用 APlayer/Meting.js 第三方库，改为纯原生 HTML + Audio API 实现的自定义播放器。新增功能：播放模式切换（顺序/循环全部/单曲循环/随机，单按钮循环）、音量滑块、可拖动定位、可展开播放列表。',
                tags: ['New', 'Feature', 'Fix', 'UI']
            },
            {
                date: '2026-07-26',
                hash: 'ef56789',
                title: 'TTS 进度条修复 + 全局音乐播放器',
                desc: '朗读进度条改为基于时间推算，解决长文本 boundary 事件不触发导致进度不动的问题；自动优选中文神经网络嗓音。新增全局音乐播放器（右下角），读取 assets/playlist.js 播放列表，支持跨页面续播。',
                tags: ['New', 'Fix']
            },
            {
                date: '2026-07-26',
                hash: '9012abc',
                title: '新增文字朗读功能（AI 读文字）',
                desc: '文章页新增浮动朗读控件，基于浏览器 Web Speech API（speechSynthesis）朗读中文全文，支持播放/暂停/继续、进度条与字符级进度。纯前端实现，无需密钥或后端，契合 GitHub Pages 静态限制。',
                tags: ['New', 'Feature']
            },
            {
                date: '2026-07-26',
                hash: '345def6',
                title: '新增文章：一生所爱（歌词）',
                desc: '新增《一生所爱》歌词页，收录电影《大话西游》片尾曲全文（唐书琛作词、卢冠廷作曲）。文章总数 7 篇、标签 15 个。',
                tags: ['New', 'Doc']
            },
            {
                date: '2026-07-25',
                hash: '789ghij',
                title: '数据驱动重构 + 首页统计修复 + 新增文章',
                desc: '全站重构：抽离共用 assets/style.css 与 assets/site.js，文章列表改为 posts.js 数据驱动。新增《摸鱼儿·恨人间情是何物》诗词赏析文章。修复 posts.js 语法错误导致首页统计显示 0 的问题。',
                tags: ['New', 'UI', 'Fix']
            },
            {
                date: '2026-06-04',
                hash: '012klmn',
                title: '全站 UI 统一',
                desc: '首页/关于/归档/日志四个页面统一为新设计语言：动态背景光球、顶部彩虹装饰条、文章卡片动画、毛玻璃导航栏。所有外部链接改为新标签打开。',
                tags: ['New', 'UI', 'Fix']
            },
            {
                date: '2026-05-06',
                hash: '345opqr',
                title: '改版：个人博客风格',
                desc: '从工具导航站改版为个人博客，删除测试文章，标签改为下拉收纳式，统一配色为深色主题 + 绿紫色调。',
                tags: ['New', 'UI']
            },
            {
                date: '2026-04-29',
                hash: '678stuv',
                title: 'NVIDIA APP 注册表修复文章',
                desc: '发布《NVIDIA APP 怎么也无法更新或卸载？可以尝试删除这个注册表项》，记录注册表路径与操作步骤。',
                tags: ['New', 'Doc']
            },
            {
                date: '2026-04-19',
                hash: '901wxyz',
                title: '博客迁移 + RPG Maker 内容整合',
                desc: '将博客从子目录迁移至根目录，整合原有 RPG Maker 插件/素材页面，新增更新日志页面。',
                tags: ['Fix', 'Doc']
            },
            {
                date: '2026-04-01',
                hash: '234abcd',
                title: '博客上线',
                desc: '基于 GitHub Pages 搭建个人博客，发布 RPG Maker MV 资源导航、插件汉化列表、GIF 素材汇总、脚本调用参考等文章。',
                tags: ['New']
            }
        ];

        var html = '';
        changelog.forEach(function(entry) {
            html += '<div class="timeline-item">';
            html += '  <div class="timeline-commit">* <span class="hash">' + entry.hash + '</span> (' + entry.date + ') ' + entry.title + '</div>';
            if (entry.desc) {
                html += '  <div class="timeline-desc">' + entry.desc + '</div>';
            }
            html += '  <div class="timeline-tags">';
            entry.tags.forEach(function(tag) {
                html += '    <span class="timeline-tag">[' + tag + ']</span>';
            });
            html += '  </div>';
            html += '</div>';
        });

        document.getElementById('timelineList').innerHTML = html;
    })();
    </script>
</body>
</html>

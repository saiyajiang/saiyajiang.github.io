<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>归档 · 悲歌的小站</title>
    <link rel="stylesheet" href="assets/style.v2.css">
</head>
<body>

    <!-- ==================== HEADER ==================== -->
    <header class="site-header" id="header">
        <div class="header-inner">
            <button class="menu-toggle" id="menuToggle" aria-label="菜单">
                <span></span><span></span><span></span>
            </button>
            <nav class="nav-menu" id="navMenu">
                <a href="index.html">~/blog</a>
                <a href="archive.html">~/archive</a>
                <a href="wiki/index.html">~/wiki</a>
                <a href="about.html">~/about</a>
                <a href="changelog.html">~/changelog</a>
            </nav>
            <button class="theme-toggle" id="themeToggle" aria-label="切换深色/亮色" title="切换主题">☀</button>
        </div>
    </header>

    <!-- ==================== 主体 ==================== -->
    <main class="page-content">

        <section class="page-card">
            <div class="card-header">$ ls archive/ --sort=time</div>
            <div class="card-body">
                <div id="archiveList"></div>
            </div>
        </section>

    </main>

    <!-- ==================== FOOTER ==================== -->
    <footer class="site-footer">
        <div class="footer-inner">
            <span>$ echo "&copy; 2026 悲歌的小站 &middot; Powered by GitHub Pages"</span>
            <div class="footer-links">
                <a href="https://github.com/saiyajiang/saiyajiang.github.io" target="_blank">Source</a>
            </div>
        </div>
    </footer>

    <button class="back-to-top" id="backToTop" aria-label="返回顶部" title="返回顶部">cd /</button>

    <script src="assets/site.js"></script>
    <script>
    (function() {
        'use strict';

        var articles = [
            { title: '摘抄', date: '2026-07-28', cat: 'literature', tags: ['摘抄', '鲍勃·迪伦', 'My Back Pages'], summary: '昔日我曾如此苍老，如今才是风华正茂。', url: 'posts/post-quote-1.html' },
            { title: '摘抄', date: '2026-07-28', cat: 'literature', tags: ['摘抄', '乔治·奥威尔'], summary: '在普天下皆骗的时代，讲真话就是一种革命行为。', url: 'posts/post-quote-2.html' },
            { title: '摘抄', date: '2026-07-28', cat: 'literature', tags: ['摘抄', '网络流传'], summary: '你若拥我入怀，疼我入骨，护我周全；我愿意蒙上双眼，不去分辩你是人是鬼。', url: 'posts/post-quote-3.html' },
            { title: '摘抄', date: '2026-07-28', cat: 'literature', tags: ['摘抄', '黄启远', '春风秋水辞'], summary: '吾与春风皆过客，君携秋水揽星河。', url: 'posts/post-quote-4.html' },
            { title: '摘抄', date: '2026-07-28', cat: 'literature', tags: ['摘抄', '邪恶', 'Evil'], summary: '世界变得越来越糟，因为邪恶不再是孤立的。坏人在相互交流。', url: 'posts/post-quote-5.html' },
            { title: '摘抄', date: '2026-07-28', cat: 'literature', tags: ['摘抄', '倩女幽魂II'], summary: '朝廷里的恩怨，非我一介武夫所能干预。通常的是非，都是真相不白的。', url: 'posts/post-quote-6.html' },
            { title: '摘抄', date: '2026-07-28', cat: 'literature', tags: ['摘抄', '坏家伙们'], summary: '到底是世界疯掉之后让人们变得疯狂呢，还是人们疯掉之后让世界显得疯狂呢。', url: 'posts/post-quote-7.html' },
            { title: '摘抄', date: '2026-07-28', cat: 'literature', tags: ['摘抄', '朱利安·巴恩斯', '终结的感觉'], summary: '不可靠的记忆与不充分的材料相遇所产生的确定性就是历史。', url: 'posts/post-quote-8.html' },
            { title: '且听风吟',                              date: '2026-07-28', cat: 'literature', tags: ['歌词', '鸣潮', '且听风吟', '万声弥新'], summary: '《鸣潮》万声弥新原声带，云之泣演唱，冉语优作词，写风与远方。', url: 'posts/post-song-2.html' },
            { title: '一生所爱',                              date: '2026-07-26', cat: 'literature', tags: ['歌词', '一生所爱', '大话西游'],         summary: '电影《大话西游》片尾曲，唐书琛作词、卢冠廷作曲，写尽错过与命运。', url: 'posts/post-song-1.html' },
            { title: '摸鱼儿·恨人间情是何物',                 date: '2026-07-25', cat: 'literature', tags: ['诗词', '元好问', '赏析'],              summary: '金·元好问《摸鱼儿·雁丘词》，因一只大雁殉情而作，成为"情"字的极致表达。', url: 'posts/post-poem-1.html' },
            { title: 'NVIDIA APP 怎么也无法更新或卸载？可以尝试删除这个注册表项', date: '2026-02-10', cat: 'tech', tags: ['Windows', 'NVIDIA', '故障排查'], summary: '记录一次 NVIDIA APP 无法更新与卸载的解决过程，通过删除注册表项解决问题。', url: 'posts/post-7.html' },
            { title: 'RPG Maker MV 资源导航页',               date: '2026-04-01', cat: 'rpgmaker', tags: ['RPG-Maker', '插件汉化', '素材', 'GIF'],  summary: 'RPG Maker MV 相关插件汉化、GIF 素材、脚本资源的整理导航。', url: 'posts/post-old-rpg.html' },
            { title: 'RPG Maker MV 插件汉化列表',              date: '2026-04-02', cat: 'rpgmaker', tags: ['RPG-Maker', '插件汉化'],               summary: '整理 RPG Maker MV 常用插件的汉化版本列表及下载地址。', url: 'posts/post-rpg-1.html' },
            { title: 'RPG Maker 事件 GIF 素材汇总',            date: '2026-03-15', cat: 'rpgmaker', tags: ['RPG-Maker', 'GIF', '素材'],             summary: '收集整理 RPG Maker 事件系统常用的 GIF 动图素材。', url: 'posts/post-rpg-2.html' },
            { title: 'RPG Maker MV 常用脚本调用参考',          date: '2026-03-20', cat: 'rpgmaker', tags: ['RPG-Maker', '脚本', '教程'],           summary: 'RPG Maker MV 中常用脚本命令的调用方法与参考手册。', url: 'posts/post-rpg-3.html' }
        ];

        // 按日期降序
        articles.sort(function(a, b) { return b.date.localeCompare(a.date); });

        // 按年份分组
        var groups = {};
        articles.forEach(function(a) {
            var year = a.date.substring(0, 4);
            if (!groups[year]) groups[year] = [];
            groups[year].push(a);
        });

        var years = Object.keys(groups).sort().reverse();
        var html = '';
        years.forEach(function(year) {
            html += '<div class="year-group">';
            html += '  <div class="year-divider">### ' + year + ' ###</div>';
            groups[year].forEach(function(a) {
                html += '<div class="article-item">';
                html += '  <div class="article-title"><a href="' + a.url + '">$ cat ' + a.title + '</a></div>';
                html += '  <div class="article-meta">';
                html += '    <span class="article-date">' + a.date + '</span>';
                for (var i = 0; i < a.tags.length; i++) {
                    html += '    <span class="article-cat">' + a.tags[i] + '</span>';
                }
                html += '  </div>';
                html += '  <div class="article-summary">' + a.summary + '</div>';
                html += '</div>';
            });
            html += '</div>';
        });

        document.getElementById('archiveList').innerHTML = html;
    })();
    </script>
</body>
</html>

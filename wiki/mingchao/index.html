<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鸣潮 · Wuthering Waves Wiki · 悲歌</title>
  <link rel="stylesheet" href="../wiki-base.css" />

  <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
</head>
<body>

<!-- ==================== 站点统一导航 ==================== -->
<header class="site-header">
  <div class="header-inner">
    <button class="menu-toggle" id="menuToggle" aria-label="菜单"><span></span><span></span><span></span></button>
    <nav class="nav-menu" id="navMenu">
      <a href="../../index.html">~/blog</a>
      <a href="../../archive.html">~/archive</a>
      <a href="../index.html">~/wiki</a>
      <a href="../../about.html">~/about</a>
      <a href="../../quotes.html">~/quotes</a>
      <a href="../../changelog.html">~/changelog</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" aria-label="切换深色/亮色" title="切换主题">&#9788;</button>
  </div>
</header>

<!-- ==================== Wiki 子板块导航 ==================== -->
<nav class="wiki-subnav" aria-label="Wiki 子板块导航">
  <a href="../index.html">门户</a>
  <a href="../taiwu/index.html">太吾绘卷</a>
  <a href="index.html" class="active">鸣潮</a>
  <a href="../db/index.html">数据库 · 知识库</a>
  <a href="../graph/index.html">图谱 <span class="subnav-count">含短句</span></a>
  <a href="../recommend/index.html">推荐与不推荐</a>
</nav>

<main class="wiki-main">

  <!-- ==================== 面包屑 ==================== -->
  <nav class="wiki-breadcrumb" aria-label="面包屑">
    <a href="../index.html">Wiki</a><span class="crumb-sep">/</span><span>鸣潮</span>
  </nav>

  <!-- ==================== Hero 标题区 + 统计条 ==================== -->
  <header class="wiki-hero">
    <div class="wiki-hero-badge">WUTHERING WAVES</div>
    <h1 class="wiki-hero-title">鸣潮 <em>图鉴 · 百科</em></h1>
    <p class="wiki-hero-sub">共鸣者 · 武器 · 声骸 · 探索地图 —— 仿 BWIKI 深蓝科幻风格，数据待后续接入。</p>
    <div class="wiki-stats">
      <div class="wiki-stat"><span>板块</span><b>0</b></div>
      <div class="wiki-stat"><span>分类</span><b id="mcCatCount">0</b></div>
      <div class="wiki-stat"><span>条目</span><b>0</b></div>
    </div>
  </header>

  <div class="wiki-desc">板块框架已搭建 · 数据待后续补充</div>

  <!-- ==================== 分类 Tab ==================== -->
  <nav class="wiki-tabs" id="mcTabs" aria-label="鸣潮板块分类">
    <button class="chip active" data-cat="共鸣者">共鸣者</button>
    <button class="chip" data-cat="武器">武器</button>
    <button class="chip" data-cat="声骸">声骸</button>
    <button class="chip" data-cat="探索">探索 · 地图</button>
    <button class="chip" data-cat="攻略">攻略 · 百科</button>
  </nav>

  <!-- ==================== 筛选 + 视图切换 ==================== -->
  <div class="wiki-toolbar">
    <div class="wiki-search">
      <span class="wiki-search-icon">⌕</span>
      <input id="searchInput" type="text" placeholder="搜索共鸣者、武器、声骸…（待数据接入）" autocomplete="off" disabled />
      <kbd>/</kbd>
    </div>
    <div class="wiki-viewswitch" role="tablist" aria-label="视图切换">
      <button class="active" data-view="card" role="tab" aria-selected="true">▦ 卡片</button>
      <button data-view="table" role="tab" aria-selected="false" disabled>☰ 表格</button>
    </div>
  </div>

  <!-- ==================== 主体：占位宫格 ==================== -->
  <main id="mcGrid" class="wiki-grid" aria-live="polite">
    <div class="mc-placeholder">
      <div class="mc-placeholder-icon">◈</div>
      <p class="mc-placeholder-title">鸣潮 Wiki 板块框架</p>
      <p class="mc-placeholder-desc">仿 BWIKI 深蓝科幻 + 个人站风格搭建。<br/>当前为占位空壳，后续将在此呈现共鸣者图鉴 / 武器图鉴 / 声骸图鉴等数据。</p>
    </div>
  </main>
</main>

<!-- ==================== 底部 Dock ==================== -->
<nav class="wiki-dock" id="mcDock" aria-label="分类快捷导航">
  <button class="active">共鸣者</button>
  <button>武器</button>
  <button>声骸</button>
  <button>探索 · 地图</button>
  <button>攻略 · 百科</button>
</nav>

<script src="mingchao.js"></script>
<script>
  // 站点统一 Header 交互：移动端菜单 + 主题切换
  (function () {
    var menuBtn = document.getElementById('menuToggle');
    var navMenu = document.getElementById('navMenu');
    if (menuBtn && navMenu) {
      menuBtn.addEventListener('click', function () {
        navMenu.classList.toggle('open');
      });
    }
    var themeBtn = document.getElementById('themeToggle');
    if (themeBtn) {
      themeBtn.addEventListener('click', function () {
        var root = document.documentElement;
        root.setAttribute('data-theme', root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
      });
    }
  })();
</script>
</body>
</html>

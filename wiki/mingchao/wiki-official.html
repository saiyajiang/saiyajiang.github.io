<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>全量收录 · 鸣潮</title>
  <link rel="stylesheet" href="../wiki-base.css" />
  <link rel="stylesheet" href="mingchao.css" />
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
</head>
<body>

<!-- ==================== 站点统一导航 ==================== -->
<header class="site-header">
  <div class="header-inner">
    <button class="menu-toggle" id="menuToggle" aria-label="菜单"><span></span><span></span><span></span></button>
    <nav class="nav-menu" id="navMenu">
      <a href="../../index.html">~/blog</a>
      <a href="../../archive.html">~/archive</a>
      <a href="../index.html">~/wiki</a>
      <a href="../../about.html">~/about</a>
      <a href="../../quotes.html">~/quotes</a>
      <a href="../../changelog.html">~/changelog</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" aria-label="切换深色/亮色" title="切换主题">&#9788;</button>
  </div>
</header>

<!-- ==================== Wiki 子板块导航 ==================== -->
<nav class="wiki-subnav" aria-label="Wiki 子板块导航">
  <a href="../index.html">门户</a>
  <a href="../taiwu/index.html">太吾绘卷</a>
  <a href="index.html" class="active">鸣潮</a>
  <a href="../db/index.html">数据库 · 知识库</a>
  <a href="../graph/index.html">图谱 <span class="subnav-count">含短句</span></a>
  <a href="../recommend/index.html">推荐与不推荐</a>
</nav>

<main class="wiki-main">

  <!-- ==================== 面包屑 ==================== -->
  <nav class="wiki-breadcrumb" aria-label="面包屑">
    <a href="../index.html">Wiki</a><span class="crumb-sep">/</span><a href="index.html">鸣潮</a><span class="crumb-sep">/</span><span id="crumbCat">全量收录</span>
  </nav>

  <!-- ==================== 分类导航 ==================== -->
  <nav class="wiki-tabs wo-catnav" id="woCatNav" aria-label="顶层分类"></nav>

  <!-- ==================== 分类标题 + 统计 ==================== -->
  <header class="wiki-hero wo-hero">
    <h1 class="wiki-hero-title" id="woTitle">全量收录</h1>
    <div class="wiki-stats">
      <div class="wiki-stat"><span>词条</span><b id="woCount">0</b></div>
      <div class="wiki-stat"><span>子分类</span><b id="woSubCount">0</b></div>
      <div class="wiki-stat"><span>正文文字</span><b id="woChars">0</b></div>
    </div>
  </header>

  <!-- ==================== 词条列表（按子分类分组） ==================== -->
  <div id="woList" class="wo-list" aria-live="polite">
    <p class="wiki-desc">正在加载数据…</p>
  </div>

  <div class="mc-detail-back"><a href="index.html">← 返回鸣潮板块首页</a></div>
</main>

<!-- ==================== 底部 Dock ==================== -->
<nav class="wiki-dock" aria-label="分类快捷导航">
  <a href="index.html">鸣潮首页</a>
  <a href="wiki-official.html">全量收录</a>
  <a href="map.html">地图</a>
  <a href="wiki-detail.html">词条详情</a>
</nav>

<script src="data/wiki-meta.js"></script>
<script src="wiki-official.js"></script>
<script>
  // 站点统一 Header 交互：移动端菜单 + 主题切换
  (function () {
    var menuBtn = document.getElementById('menuToggle');
    var navMenu = document.getElementById('navMenu');
    if (menuBtn && navMenu) {
      menuBtn.addEventListener('click', function () { navMenu.classList.toggle('open'); });
    }
    var themeBtn = document.getElementById('themeToggle');
    if (themeBtn) {
      themeBtn.addEventListener('click', function () {
        var root = document.documentElement;
        root.setAttribute('data-theme', root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
      });
    }
  })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taiwu · 太吾绘卷 · 悲歌</title>
  <link rel="stylesheet" href="../../db/db.css" />
  <link rel="stylesheet" href="taiwu.css" />
<link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
</head>
<body>

<!-- ==================== 站点统一导航 ==================== -->
<header class="site-header">
  <div class="header-inner">
    <button class="menu-toggle" id="menuToggle" aria-label="菜单"><span></span><span></span><span></span></button>
    <nav class="nav-menu" id="navMenu">
      <a href="../../index.html">~/blog</a>
      <a href="../../archive.html">~/archive</a>
      <a href="../index.html">~/wiki</a>
      <a href="index.html" class="active">~/taiwu</a>
      <a href="../../about.html">~/about</a>
      <a href="../../quotes.html">~/quotes</a>
      <a href="../../changelog.html">~/changelog</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" aria-label="切换深色/亮色" title="切换主题">&#9788;</button>
  </div>
</header>

<!-- ==================== 顶部状态区 ==================== -->
<header class="db-header">
  <div class="db-brand">
    <div class="db-logo">✦</div>
    <div class="db-brand-text">
      <h1>太吾绘卷 · Taiwu</h1>
      <p>WIKI · SECTS · LORE</p>
    </div>
  </div>

  <div class="db-search">
    <span class="db-search-icon">⌕</span>
    <input id="searchInput" type="text" placeholder="搜索门派、事件、对话、关键词…" autocomplete="off" />
    <kbd id="searchHint">/</kbd>
  </div>

  <div class="db-stats">
    <div class="stat-card"><span>板块</span><b id="statBoard">0</b></div>
    <div class="stat-card"><span>分类</span><b id="statCat">0</b></div>
    <div class="stat-card"><span>条目</span><b id="statItem">0</b></div>
  </div>
</header>

<div class="db-desc" id="statDesc"></div>

<!-- ==================== 板块切换 ==================== -->
<nav class="db-games" id="boardTabs" aria-label="Taiwu 板块切换"></nav>

<!-- ==================== 筛选 + 视图切换 ==================== -->
<div class="db-toolbar">
  <div class="db-chips" id="categoryChips"></div>
  <div class="db-viewswitch" role="tablist" aria-label="视图切换">
    <button class="active" data-view="card" role="tab" aria-selected="true">▦ 卡片</button>
    <button data-view="table" role="tab" aria-selected="false">☰ 表格</button>
  </div>
</div>

<!-- ==================== 主体 ==================== -->
<main id="dbGrid" class="db-grid" aria-live="polite"></main>
<div id="emptyState" class="db-empty" hidden>
  <div class="db-empty-icon">∅</div>
  <p id="emptyTitle">暂无数据</p>
  <span id="emptyDesc">在 wiki/taiwu/data/ 中添加板块数据</span>
</div>

<!-- ==================== 底部 Dock ==================== -->
<nav class="db-dock" id="dbDock" aria-label="分类快捷导航"></nav>

<script src="data/taiwu-core.js"></script>
<script src="data/sects.js"></script>
<script src="taiwu.js"></script>
<script>
  // 站点统一 Header 交互：移动端菜单 + 主题切换（不引入 site.js，避免播放器）
  (function () {
    var menuBtn = document.getElementById('menuToggle');
    var navMenu = document.getElementById('navMenu');
    if (menuBtn && navMenu) {
      menuBtn.addEventListener('click', function () {
        navMenu.classList.toggle('open');
      });
    }
    var themeBtn = document.getElementById('themeToggle');
    if (themeBtn) {
      themeBtn.addEventListener('click', function () {
        var root = document.documentElement;
        root.setAttribute('data-theme', root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
      });
    }
  })();
</script>
</body>
</html>

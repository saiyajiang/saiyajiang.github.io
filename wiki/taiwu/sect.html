<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>词条 · 太吾绘卷 · 悲歌</title>
  <link rel="stylesheet" href="../wiki-base.css" />
  <link rel="stylesheet" href="taiwu.css" />
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
</head>
<body>

<!-- ==================== 站点统一导航 ==================== -->
<header class="site-header">
  <div class="header-inner">
    <button class="menu-toggle" id="menuToggle" aria-label="菜单"><span></span><span></span><span></span></button>
    <nav class="nav-menu" id="navMenu">
      <a href="../../index.html">~/blog</a>
      <a href="../../archive.html">~/archive</a>
      <a href="../index.html">~/wiki</a>
      <a href="../../about.html">~/about</a>
      <a href="../../quotes.html">~/quotes</a>
      <a href="../../changelog.html">~/changelog</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" aria-label="切换深色/亮色" title="切换主题">&#9788;</button>
  </div>
</header>

<!-- ==================== Wiki 子板块导航 ==================== -->
<nav class="wiki-subnav" aria-label="Wiki 子板块导航">
  <a href="../index.html">门户</a>
  <a href="index.html" class="active">太吾绘卷</a>
  <a href="../mingchao/index.html">鸣潮 <span class="subnav-count">框架</span></a>
  <a href="../db/index.html">数据库 · 知识库</a>
</nav>

<main class="wiki-main">

  <!-- ==================== 面包屑 ==================== -->
  <nav class="wiki-breadcrumb" aria-label="面包屑">
    <a href="../index.html">Wiki</a><span class="crumb-sep">/</span>
    <a href="index.html">太吾绘卷</a><span class="crumb-sep">/</span>
    <span id="crumbSect">词条</span>
  </nav>

  <!-- ==================== 词条主体：左侧章节正文 + 右侧 infobox ==================== -->
  <article class="sect-wrap">

    <header class="sect-head">
      <div class="sect-badge" id="sectBadge">--</div>
      <h1 class="sect-title" id="sectTitle">词条加载中…</h1>
      <p class="sect-sub" id="sectSub"></p>
    </header>

    <div class="sect-layout">
      <!-- 左侧：章节正文 -->
      <div class="sect-main">
        <nav class="sect-toc" id="sectTocWrap" hidden>
          <h2 class="sect-toc-title">页内目录</h2>
          <ol class="sect-toc-list" id="sectToc"></ol>
        </nav>
        <div class="sect-body" id="sectBody"></div>
        <div id="sectMissing" class="wiki-empty" hidden>
          <div class="wiki-empty-icon">∅</div>
          <p id="emptyTitle">词条不存在</p>
          <span id="emptyDesc">ID 无效或已被移除，<a href="index.html">返回太吾列表</a></span>
        </div>
        <!-- 上一条 / 下一条 -->
        <nav class="sect-pager" id="sectPager" aria-label="相邻词条导航"></nav>
      </div>

      <!-- 右侧：infobox 信息栏 -->
      <aside class="sect-aside">
        <div class="tf-infobox" id="sectInfobox"></div>
      </aside>
    </div>
  </article>
</main>

<!-- ==================== 底部 Dock ==================== -->
<nav class="wiki-dock" aria-label="板块快捷导航">
  <a href="../index.html">门户</a>
  <a href="index.html" class="active">太吾绘卷</a>
  <a href="../mingchao/index.html">鸣潮</a>
  <a href="../db/index.html">数据库 · 知识库</a>
</nav>

<script src="data/taiwu-core.js"></script>
<script src="data/sects.js"></script>
<script src="sect.js"></script>
<script>
  // 站点统一 Header 交互：移动端菜单 + 主题切换（不引入 site.js，避免播放器）
  (function () {
    var menuBtn = document.getElementById('menuToggle');
    var navMenu = document.getElementById('navMenu');
    if (menuBtn && navMenu) {
      menuBtn.addEventListener('click', function () {
        navMenu.classList.toggle('open');
      });
    }
    var themeBtn = document.getElementById('themeToggle');
    if (themeBtn) {
      themeBtn.addEventListener('click', function () {
        var root = document.documentElement;
        root.setAttribute('data-theme', root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
      });
    }
  })();
</script>
</body>
</html>

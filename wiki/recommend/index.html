<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>推荐与不推荐 · Wiki · 悲歌</title>
  <link rel="stylesheet" href="../wiki-base.css" />
  <link rel="stylesheet" href="recommend.css" />
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
</head>
<body>

<!-- ==================== 站点统一导航 ==================== -->
<header class="site-header">
  <div class="header-inner">
    <button class="menu-toggle" id="menuToggle" aria-label="菜单"><span></span><span></span><span></span></button>
    <nav class="nav-menu" id="navMenu">
      <a href="../../index.html">~/blog</a>
      <a href="../../archive.html">~/archive</a>
      <a href="../index.html" class="active">~/wiki</a>
      <a href="../../about.html">~/about</a>
      <a href="../../quotes.html">~/quotes</a>
      <a href="../../changelog.html">~/changelog</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" aria-label="切换深色/亮色" title="切换主题">&#9788;</button>
  </div>
</header>

<!-- ==================== Wiki 子板块导航 ==================== -->
<nav class="wiki-subnav" aria-label="Wiki 子板块导航">
  <a href="../index.html">门户</a>
  <a href="../taiwu/index.html">太吾绘卷</a>
  <a href="../mingchao/index.html">鸣潮 <span class="subnav-count">框架</span></a>
  <a href="../db/index.html">数据库 · 知识库</a>
  <a href="../graph/index.html">图谱 <span class="subnav-count">含短句</span></a>
  <a href="index.html" class="active">推荐与不推荐</a>
</nav>

<main class="wiki-main">

  <!-- ==================== 面包屑 ==================== -->
  <nav class="wiki-breadcrumb" aria-label="面包屑">
    <a href="../index.html">Wiki</a><span class="crumb-sep">/</span><span>推荐与不推荐</span>
  </nav>

  <!-- ==================== Hero：标题 + 统计 ==================== -->
  <header class="wiki-hero">
    <div class="wiki-hero-badge">RECOMMEND &amp; AVOID</div>
    <h1 class="wiki-hero-title">推荐与不推荐 <em>避坑清单</em></h1>
    <p class="wiki-hero-sub">影视剧 / UP主 / 广告媒体等记录 —— 不推荐条目均附「不推荐原因」，按类型筛选或关键词搜索快速定位。</p>
    <div class="wiki-stats">
      <div class="wiki-stat"><span>推荐</span><b id="statRec">0</b></div>
      <div class="wiki-stat"><span>不推荐</span><b id="statAvoid">0</b></div>
      <div class="wiki-stat"><span>共记录</span><b id="statTotal">0</b></div>
    </div>
  </header>

  <!-- ==================== 筛选 + 搜索 ==================== -->
  <div class="wiki-toolbar">
    <div class="wiki-search">
      <span class="wiki-search-icon">⌕</span>
      <input id="searchInput" type="text" placeholder="搜索：名称 / 主演 / 编剧 / 导演 / 出品公司 / UID / 原因…" autocomplete="off" />
      <kbd>/</kbd>
    </div>
    <div class="wiki-chips" id="typeChips"></div>
  </div>

  <!-- ==================== 记录列表 ==================== -->
  <main id="recGrid" class="rec-grid" aria-live="polite"></main>
  <div id="emptyState" class="wiki-empty" hidden>
    <div class="wiki-empty-icon">∅</div>
    <p id="emptyTitle">暂无记录</p>
    <span id="emptyDesc">调整筛选或关键词后再试</span>
  </div>

</main>

<!-- ==================== 底部 Dock ==================== -->
<nav class="wiki-dock" aria-label="板块快捷导航">
  <a href="../index.html">门户</a>
  <a href="../taiwu/index.html">太吾绘卷</a>
  <a href="../mingchao/index.html">鸣潮</a>
  <a href="../db/index.html">数据库 · 知识库</a>
  <a href="../graph/index.html">图谱</a>
  <a href="index.html" class="active">推荐与不推荐</a>
</nav>

<!-- 数据：推荐与不推荐独立数据源 -->
<script src="../db/data/recommend.js"></script>
<!-- 列表逻辑 -->
<script src="recommend.js"></script>
<script>
  // 站点统一 Header 交互：移动端菜单 + 主题切换
  (function () {
    var menuBtn = document.getElementById('menuToggle');
    var navMenu = document.getElementById('navMenu');
    if (menuBtn && navMenu) {
      menuBtn.addEventListener('click', function () {
        navMenu.classList.toggle('open');
      });
    }
    var themeBtn = document.getElementById('themeToggle');
    if (themeBtn) {
      themeBtn.addEventListener('click', function () {
        var root = document.documentElement;
        root.setAttribute('data-theme', root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
      });
    }
  })();
</script>
</body>
</html>

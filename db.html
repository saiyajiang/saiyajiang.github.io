<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知识数据库 · 悲歌</title>
  <link rel="stylesheet" href="assets/db.css" />
</head>
<body>

<!-- ==================== 顶部状态区 ==================== -->
<header class="db-header">
  <div class="db-brand">
    <div class="db-logo">✦</div>
    <div class="db-brand-text">
      <h1>知识数据库</h1>
      <p>WIKI · QUOTES · EXCERPTS</p>
    </div>
  </div>

  <div class="db-search">
    <span class="db-search-icon">⌕</span>
    <input id="searchInput" type="text" placeholder="搜索条目、出处、关键词…" autocomplete="off" />
    <kbd id="searchHint">/</kbd>
  </div>

  <div class="db-stats">
    <div class="stat-card"><span>分类</span><b id="statCat">0</b></div>
    <div class="stat-card"><span>条目</span><b id="statItem">0</b></div>
    <div class="stat-card"><span>摘抄</span><b id="statQuote">0</b></div>
  </div>
</header>

<!-- ==================== 图表区 ==================== -->
<section class="db-charts">
  <div class="chart-panel">
    <div class="chart-head"><span class="dot dot-a"></span>分类占比 <em>CATEGORY RATIO</em></div>
    <div class="chart-body donut-wrap">
      <svg id="donutChart" viewBox="0 0 42 42" role="img" aria-label="分类占比环形图"></svg>
      <div class="donut-center"><b id="donutTotal">0</b><span>条目</span></div>
      <div class="donut-legend" id="donutLegend"></div>
    </div>
  </div>
  <div class="chart-panel">
    <div class="chart-head"><span class="dot dot-b"></span>条目分布 <em>ITEM DISTRIBUTION</em></div>
    <div class="chart-body bar-wrap" id="barChart"></div>
  </div>
</section>

<!-- ==================== 筛选 + 视图切换 ==================== -->
<div class="db-toolbar">
  <div class="db-chips" id="categoryChips"></div>
  <div class="db-viewswitch" role="tablist" aria-label="视图切换">
    <button class="active" data-view="card" role="tab" aria-selected="true">▦ 卡片</button>
    <button data-view="table" role="tab" aria-selected="false">☰ 表格</button>
  </div>
</div>

<!-- ==================== 主体 ==================== -->
<main id="dbGrid" class="db-grid" aria-live="polite"></main>
<div id="emptyState" class="db-empty" hidden>
  <div class="db-empty-icon">∅</div>
  <p>没有匹配的条目</p>
  <span>换个关键词试试，或清空筛选条件</span>
</div>

<!-- ==================== 底部 Dock ==================== -->
<nav class="db-dock" id="dbDock" aria-label="分类快捷导航"></nav>

<script src="assets/data/site-config.js"></script>
<script src="assets/data/wiki.js"></script>
<script src="assets/data/quotes.js"></script>
<script src="assets/db.js"></script>
</body>
</html>

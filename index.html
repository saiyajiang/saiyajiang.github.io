<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>悲歌的小站</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22%230d0d0d%22/><text x=%2232%22 y=%2244%22 text-anchor=%22middle%22 font-family=%22Inter%22 font-weight=%22700%22 font-size=%2228%22 fill=%22%236ee7b7%22>B</text></svg>" type="image/svg+xml" />
  <meta name="description" content="随便写写，记录一些东西。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0d0d;
      --bg-card: #161616;
      --bg-card-hover: #1c1c1c;
      --border: #2a2a2a;
      --border-hover: #3a3a3a;
      --text-primary: #e8e8e8;
      --text-secondary: #888;
      --text-muted: #4a4a4a;
      --accent: #6ee7b7;
      --accent-2: #818cf8;
      --tag-bg: rgba(255,255,255,0.04);
      --tag-border: rgba(255,255,255,0.07);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Inter', 'Noto Sans SC', sans-serif;
      font-size: 15px;
      line-height: 1.7;
      min-height: 100vh;
    }

    /* ── 顶部导航 ── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(13,13,13,0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 860px; margin: 0 auto;
      padding: 0 24px; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo {
      font-size: 15px; font-weight: 600;
      color: var(--text-primary); text-decoration: none;
      letter-spacing: 0.2px;
      transition: opacity 0.15s;
    }
    .logo:hover { opacity: 0.75; }
    nav { display: flex; align-items: center; gap: 4px; }
    nav a {
      color: var(--text-secondary); text-decoration: none;
      font-size: 13px; padding: 5px 10px; border-radius: 6px;
      transition: all 0.2s;
    }
    nav a:hover { color: var(--text-primary); background: rgba(255,255,255,0.05); }
    nav a.active { color: var(--text-primary); }

    /* ── 顶部区域 ── */
    .top-area {
      max-width: 860px; margin: 0 auto;
      padding: 56px 24px 32px;
    }
    .site-title {
      font-size: 26px; font-weight: 700;
      color: var(--text-primary); margin-bottom: 8px;
      letter-spacing: -0.5px;
      display: flex; align-items: center; gap: 10px;
    }
    .site-title-dot {
      display: inline-block;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      opacity: 0.7;
      margin-bottom: 2px;
    }
    .site-desc {
      font-size: 14px; color: var(--text-muted);
      margin-bottom: 28px;
      letter-spacing: 0.1px;
    }

    /* ── 搜索 + 标签筛选行 ── */
    .filter-row {
      display: flex; align-items: center; gap: 10px;
    }
    .search-wrap {
      flex: 1; position: relative; max-width: 420px;
    }
    .search-wrap input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 14px 9px 38px;
      color: var(--text-primary); font-size: 13px;
      font-family: inherit; outline: none;
      transition: border-color 0.2s;
    }
    .search-wrap input:focus { border-color: rgba(110,231,183,0.35); box-shadow: 0 0 0 3px rgba(110,231,183,0.06); }
    .search-wrap input::placeholder { color: var(--text-muted); }
    .search-icon {
      position: absolute; left: 12px; top: 50%;
      transform: translateY(-50%); color: var(--text-muted);
      pointer-events: none;
    }

    /* ── 标签下拉 ── */
    .tag-dropdown {
      position: relative;
    }
    .tag-toggle-btn {
      display: flex; align-items: center; gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 14px;
      color: var(--text-secondary); font-size: 13px;
      font-family: inherit; cursor: pointer;
      transition: all 0.2s; white-space: nowrap;
    }
    .tag-toggle-btn:hover { color: var(--text-primary); border-color: rgba(255,255,255,0.15); }
    .tag-toggle-btn.has-active {
      color: var(--accent);
      border-color: rgba(110,231,183,0.3);
      background: rgba(110,231,183,0.05);
    }
    .tag-toggle-btn svg { transition: transform 0.2s; }
    .tag-toggle-btn.open svg { transform: rotate(180deg); }

    .tag-panel {
      display: none;
      position: absolute; top: calc(100% + 8px); right: 0;
      background: #1a1a1a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      min-width: 260px; max-width: 340px;
      z-index: 200;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    .tag-panel.open { display: block; }
    .tag-panel-inner {
      display: flex; flex-wrap: wrap; gap: 7px;
    }
    .tag-btn {
      background: var(--tag-bg);
      border: 1px solid var(--tag-border);
      color: var(--text-secondary);
      font-size: 12px; font-family: inherit;
      padding: 4px 11px; border-radius: 100px;
      cursor: pointer; transition: all 0.15s;
    }
    .tag-btn:hover {
      border-color: rgba(255,255,255,0.15);
      color: var(--text-primary);
    }
    .tag-btn.active {
      background: rgba(110,231,183,0.12);
      border-color: rgba(110,231,183,0.35);
      color: var(--accent);
      font-weight: 600;
    }
    .active-tag-label {
      font-size: 12px; color: var(--text-secondary);
      margin-left: 2px;
    }
    .active-tag-clear {
      font-size: 12px; color: var(--text-muted);
      cursor: pointer; margin-left: 2px;
      padding: 2px 4px; border-radius: 4px;
      transition: color 0.15s;
    }
    .active-tag-clear:hover { color: var(--text-secondary); }

    /* ── 文章列表 ── */
    .articles-section {
      max-width: 860px; margin: 0 auto;
      padding: 0 24px 80px;
    }
    .section-bar {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 14px 0 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }
    .section-bar-left {
      display: flex; align-items: center; gap: 10px;
    }
    .section-label {
      font-size: 11px; color: var(--text-muted);
      letter-spacing: 1.2px; text-transform: uppercase;
      font-weight: 500;
    }
    .result-count { font-size: 12px; color: var(--text-muted); }
    .current-tag-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; color: var(--accent);
      background: rgba(110,231,183,0.07);
      border: 1px solid rgba(110,231,183,0.2);
      padding: 2px 9px; border-radius: 100px;
    }

    /* ── 文章列表项（时间轴风格，无大卡片） ── */
    .post-list { display: flex; flex-direction: column; gap: 0; }
    .post-item {
      display: flex; align-items: baseline; gap: 0;
      padding: 16px 0 16px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      text-decoration: none;
      transition: all 0.18s;
      position: relative;
    }
    .post-item::before {
      content: '';
      position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      width: 2px; height: 0;
      background: var(--accent);
      border-radius: 2px;
      transition: height 0.2s ease;
      opacity: 0.7;
    }
    .post-item:hover::before { height: 60%; }
    .post-item:last-child { border-bottom: none; }
    .post-item:hover { background: rgba(255,255,255,0.018); }
    .post-item:hover .post-item-title { color: var(--accent); }
    .post-date {
      flex-shrink: 0; width: 88px;
      font-size: 12px; color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }
    .post-item-main { flex: 1; min-width: 0; }
    .post-item-title {
      font-size: 15px; font-weight: 500;
      color: var(--text-primary);
      line-height: 1.4;
      transition: color 0.15s;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .post-item-tags {
      display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px;
    }
    .post-item-tag {
      font-size: 11px; color: var(--text-muted);
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 2px 8px; border-radius: 3px;
      cursor: pointer; transition: all 0.15s;
      letter-spacing: 0.2px;
    }
    .post-item-tag:hover {
      color: var(--accent);
      border-color: rgba(110,231,183,0.25);
      background: rgba(110,231,183,0.06);
    }

    /* ── 无结果 ── */
    .no-results {
      text-align: center; padding: 60px 20px;
      color: var(--text-muted); display: none; font-size: 14px;
    }

    /* ── 底部 ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 28px 24px; text-align: center;
      color: var(--text-muted); font-size: 12px;
    }
    footer a { color: var(--text-muted); text-decoration: none; }
    footer a:hover { color: var(--text-secondary); }

    /* ── 滚动条 ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── 响应式 ── */
    @media (max-width: 600px) {
      .top-area { padding: 32px 16px 20px; }
      .articles-section { padding: 0 16px 60px; }
      .post-date { width: 70px; font-size: 11px; }
      .post-item-title { font-size: 14px; white-space: normal; }
      .tag-panel { left: 0; right: auto; }
    }
  </style>
</head>
<body>

<!-- 导航 -->
<header>
  <div class="header-inner">
    <a href="index.html" class="logo">悲歌的小站</a>
    <nav>
      <a href="index.html" class="active">首页</a>
      <a href="archive.html">归档</a>
      <a href="changelog.html">日志</a>
      <a href="about.html">关于</a>
    </nav>
  </div>
</header>

<!-- 顶部区域 -->
<div class="top-area">
  <div class="site-title">悲歌的小站<span class="site-title-dot"></span></div>
  <div class="site-desc">随便写写，记录一些东西。</div>

  <!-- 搜索 + 标签筛选 -->
  <div class="filter-row">
    <div class="search-wrap">
      <svg class="search-icon" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="searchInput" placeholder="搜索…" autocomplete="off" />
    </div>

    <!-- 标签下拉 -->
    <div class="tag-dropdown" id="tagDropdown">
      <button class="tag-toggle-btn" id="tagToggleBtn" onclick="toggleTagPanel()">
        <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>
        </svg>
        <span id="tagBtnLabel">标签</span>
        <svg width="11" height="11" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </button>
      <div class="tag-panel" id="tagPanel">
        <div class="tag-panel-inner" id="tagPanelInner"></div>
      </div>
    </div>
  </div>
</div>

<!-- 文章列表 -->
<main class="articles-section">
  <div class="section-bar">
    <div class="section-bar-left">
      <span class="section-label">文章</span>
      <span class="result-count" id="resultCount"></span>
      <span id="currentTagBadge"></span>
    </div>
  </div>
  <div class="post-list" id="postList"></div>
  <div class="no-results" id="noResults">没有找到相关内容</div>
</main>

<!-- 底部 -->
<footer>
  <p><a href="about.html">关于</a> · <a href="changelog.html">更新日志</a> · <a href="https://github.com/saiyajiang" target="_blank">GitHub</a></p>
</footer>

<script>
// ── 文章数据 ──
const articles = [
  {
    id: "post-7",
    title: "NVIDIA APP 怎么也无法更新或卸载？可以尝试删除这个注册表项",
    excerpt: "NVIDIA 安装程序无法继续，提示「已找到在等待重新启动的设备驱动程序」，重启也没用。最后发现是注册表里有个 NVIDIA 残留的待重启标记键，删掉就解决了。",
    date: "2026-04-29",
    tags: ["Windows", "NVIDIA", "故障排查", "注册表"],
    href: "posts/post-7.html"
  },
  {
    id: "post-old-rpg",
    title: "RPG Maker MV 资源导航页",
    excerpt: "收录所有 RPG Maker 相关资源链接，包括插件汉化、GIF素材、脚本参考等。",
    date: "2026-04-01",
    tags: ["RPG-Maker", "插件汉化", "素材", "GIF", "脚本"],
    href: "posts/post-old-rpg.html"
  },
  {
    id: "post-rpg-1",
    title: "RPG Maker MV 插件汉化列表",
    excerpt: "整理了所有汉化过的 RPG Maker 插件，包括自带插件汉化、QPlugins 汉化、Yanfly 汉化等。",
    date: "2026-04-01",
    tags: ["RPG-Maker", "插件汉化"],
    href: "posts/post-rpg-1.html"
  },
  {
    id: "post-rpg-2",
    title: "RPG Maker 事件 GIF 素材汇总",
    excerpt: "收集整理了 RPG Maker 可用的事件 GIF 素材，包括开关门动画、伸缩桥、机关触发效果等。",
    date: "2026-03-20",
    tags: ["RPG-Maker", "素材", "GIF"],
    href: "posts/post-rpg-2.html"
  },
  {
    id: "post-rpg-3",
    title: "RPG Maker MV 常用脚本调用参考",
    excerpt: "整理了 RPG Maker MV 中常用的脚本调用命令，涵盖开关、变量、队伍、游戏数据等常用操作。",
    date: "2026-03-15",
    tags: ["RPG-Maker", "脚本", "教程"],
    href: "posts/post-rpg-3.html"
  }
];

// ── 状态 ──
let currentTag = '';
let currentSearch = '';

// ── 标签面板开关 ──
function toggleTagPanel() {
  const panel = document.getElementById('tagPanel');
  const btn = document.getElementById('tagToggleBtn');
  const isOpen = panel.classList.toggle('open');
  btn.classList.toggle('open', isOpen);
}

// 点击外部关闭
document.addEventListener('click', e => {
  const dropdown = document.getElementById('tagDropdown');
  if (!dropdown.contains(e.target)) {
    document.getElementById('tagPanel').classList.remove('open');
    document.getElementById('tagToggleBtn').classList.remove('open');
  }
});

// ── 渲染标签面板 ──
function renderTagPanel() {
  const allTags = [...new Set(articles.flatMap(a => a.tags))].sort();
  const inner = document.getElementById('tagPanelInner');
  inner.innerHTML = `
    <button class="tag-btn ${!currentTag ? 'active' : ''}" data-tag="">全部</button>
    ${allTags.map(t => `<button class="tag-btn ${currentTag === t ? 'active' : ''}" data-tag="${t}">#${t}</button>`).join('')}
  `;
  inner.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentTag = btn.dataset.tag;
      // 关闭面板
      document.getElementById('tagPanel').classList.remove('open');
      document.getElementById('tagToggleBtn').classList.remove('open');
      updateTagBtnLabel();
      renderTagPanel();
      render();
    });
  });
}

function updateTagBtnLabel() {
  const btn = document.getElementById('tagToggleBtn');
  const label = document.getElementById('tagBtnLabel');
  if (currentTag) {
    label.textContent = '#' + currentTag;
    btn.classList.add('has-active');
  } else {
    label.textContent = '标签';
    btn.classList.remove('has-active');
  }
}

// ── 渲染列表 ──
function render() {
  const list = document.getElementById('postList');
  const noResults = document.getElementById('noResults');
  const countEl = document.getElementById('resultCount');
  const badgeEl = document.getElementById('currentTagBadge');

  const q = currentSearch.toLowerCase();
  const filtered = articles.filter(a => {
    const matchTag = !currentTag || a.tags.includes(currentTag);
    const matchSearch = !q ||
      a.title.toLowerCase().includes(q) ||
      a.tags.join(' ').toLowerCase().includes(q) ||
      a.excerpt.toLowerCase().includes(q);
    return matchTag && matchSearch;
  });

  // 当前标签徽章
  if (currentTag) {
    badgeEl.innerHTML = `<span class="current-tag-badge">#${currentTag} <span class="active-tag-clear" onclick="clearTag()">✕</span></span>`;
  } else {
    badgeEl.innerHTML = '';
  }

  if (filtered.length === 0) {
    list.innerHTML = '';
    noResults.style.display = 'block';
    countEl.textContent = '';
  } else {
    noResults.style.display = 'none';
    countEl.textContent = filtered.length + ' 篇';
    list.innerHTML = filtered.map(a => `
      <a class="post-item" href="${a.href}">
        <span class="post-date">${a.date.slice(0, 7)}</span>
        <div class="post-item-main">
          <div class="post-item-title">${a.title}</div>
          <div class="post-item-tags">
            ${a.tags.map(t => `<span class="post-item-tag" data-tag="${t}">#${t}</span>`).join('')}
          </div>
        </div>
      </a>`).join('');

    // 卡片内标签点击
    list.querySelectorAll('.post-item-tag').forEach(el => {
      el.addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        currentTag = el.dataset.tag;
        updateTagBtnLabel();
        renderTagPanel();
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
  }
}

function clearTag() {
  currentTag = '';
  updateTagBtnLabel();
  renderTagPanel();
  render();
}

// ── 搜索 ──
document.getElementById('searchInput').addEventListener('input', e => {
  currentSearch = e.target.value.trim();
  render();
});

// ── 初始化 ──
renderTagPanel();
render();
</script>
</body>
</html>

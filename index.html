<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>悲歌的小站</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta name="description" content="随便写写，记录一些东西。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <script>
    (function () {
      var t; try { t = localStorage.getItem("theme"); } catch (e) {}
      document.documentElement.setAttribute("data-theme", t || "dark");
    })();
  </script>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body data-page="home">

<div class="bg-layer">
  <div class="bg-orb bg-orb--1"></div>
  <div class="bg-orb bg-orb--2"></div>
  <div class="bg-orb bg-orb--3"></div>
  <div class="bg-grid"></div>
</div>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">悲歌的小站</a>
    <nav class="site-nav">
      <a href="index.html">Blog</a>
      <a href="archive.html">Archive</a>
      <a href="about.html">About</a>
      <a href="changelog.html">Changelog</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" aria-label="切换深色/亮色">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<main class="page">
  <section class="hero">
    <div class="hero-row">
      <div class="hero-avatar">悲</div>
      <div>
        <div class="hero-greeting">Hi, there </div>
        <div class="hero-name">我是悲歌</div>
      </div>
    </div>
    <p class="hero-desc">随便写写，记录一些东西。游戏开发、编程随笔、折腾记录，以及偶尔的一些碎碎念。</p>
    <div class="hero-stats">
      <div class="hero-stat"><span class="hero-stat-num">7</span><span class="hero-stat-label">文章</span></div>
      <div class="hero-stat"><span class="hero-stat-num">15</span><span class="hero-stat-label">标签</span></div>
    </div>
  </section>

  <div class="divider"><div class="divider-line"></div><div class="divider-dot"></div><div class="divider-line"></div></div>

  <div class="search-bar">
    <div class="search-box">
      <span class="search-icon">⌕</span>
      <input type="text" id="searchInput" placeholder="搜索文章..." />
    </div>
    <button class="tag-toggle" id="tagToggleBtn">§ 标签</button>
  </div>

  <div class="tag-cloud" id="tagCloud"></div>
  <div class="active-tags" id="activeTags"></div>

  <div class="section-head">
    <span class="section-label">Recent Posts</span>
    <span class="result-count" id="resultCount"></span>
  </div>

  <div class="post-list" id="postList"></div>

  <div class="no-results" id="noResults">
    没有找到匹配的文章<br><span style="font-size:12px;color:var(--text-muted);margin-top:6px;display:inline-block;">试试其他关键词或标签</span>
  </div>
</main>

<footer class="site-footer">
  © 2026 悲歌的小站 · Powered by GitHub Pages
   · <a href="https://github.com/saiyajiang/saiyajiang.github.io" target="_blank">Source</a>
</footer>

<script src="assets/playlist.js?v=20260727bb"></script>
<script src="assets/posts.js?v=20260727bb"></script>
<script src="assets/site.js?v=20260727bb"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css">
<script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/meting@2.0.1/dist/Meting.min.js"></script>
</body>
</html>

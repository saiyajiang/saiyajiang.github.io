<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>悲歌的小站</title>
  <link rel="stylesheet" href="assets/style.v2.css" />
</head>
<body data-page="blog">

<!-- ==================== HEADER ==================== -->
<header class="site-header" id="header">
  <div class="header-inner">
    <button class="menu-toggle" id="menuToggle" aria-label="菜单">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav-menu" id="navMenu">
      <a href="index.html">~/blog</a>
      <a href="archive.html">~/archive</a>
      <a href="wiki/index.html">~/wiki</a>
      <a href="about.html">~/about</a>
      <a href="quotes.html">~/quotes</a>
      <a href="changelog.html">~/changelog</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" aria-label="切换深色/亮色" title="切换主题">&#9788;</button>
  </div>
</header>

<!-- ==================== 三栏布局 ==================== -->
<div class="main-wrapper">

  <aside class="sidebar sidebar-left">
    <div class="card">
      <div class="card-header">$ tags</div>
      <div class="card-body-sm">
        <div class="tag-cloud" id="tagCloud"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">$ whoami</div>
      <div class="card-body-sm profile-card">
        <div class="profile-avatar">&#9998;</div>
        <div class="profile-name">悲歌</div>
        <div class="profile-bio">随便写写，记录一些东西。<br>游戏开发、编程随笔、折腾记录，以及偶尔的一些碎碎念。</div>
        <div class="profile-links"><a href="https://github.com/saiyajiang" target="_blank">GitHub</a></div>
      </div>
    </div>
  </aside>

  <main id="app" class="content-main"></main>

  <aside class="sidebar sidebar-right">
    <div class="card">
      <div class="card-header">$ fortune <a href="#" class="fortune-refresh" id="fortuneRefresh" title="再抽一条">&#8635;</a></div>
      <div class="card-body-sm fortune-card">
        <div class="fortune-cat" id="fortuneCategory"></div>
        <a class="fortune-text" id="fortuneText" href="#" target="_blank"></a>
      </div>
    </div>
  </aside>

</div>

<!-- ==================== FOOTER ==================== -->
<footer class="site-footer">
  <div class="footer-inner">
    <span>$ echo "&copy; 2026 悲歌的小站 &middot; Powered by GitHub Pages"</span>
    <div class="footer-links">
      <a href="https://github.com/saiyajiang/saiyajiang.github.io" target="_blank">Source</a>
    </div>
  </div>
</footer>

<button class="back-to-top" id="backToTop" aria-label="返回顶部" title="返回顶部">cd /</button>

<script src="assets/data/site-config.js"></script>
<script src="assets/data/blog.js"></script>
<script src="assets/data/quotes.js"></script>
<script src="assets/data/wiki.js"></script>
<script src="assets/site.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文章标题 · 悲歌的小站</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0d0d0d;--bg-card:#161616;--border:#2a2a2a;--border-hover:#404040;--text-primary:#f0f0f0;--text-secondary:#999;--text-muted:#555;--accent:#6ee7b7;--accent-2:#818cf8; }
    *{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
    body{background:var(--bg);color:var(--text-primary);font-family:'Inter','Noto Sans SC',sans-serif;font-size:16px;line-height:1.8}
    header{position:sticky;top:0;z-index:100;background:rgba(13,13,13,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
    .header-inner{max-width:760px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between}
    .logo{font-size:18px;font-weight:700;color:var(--text-primary);text-decoration:none;display:flex;align-items:center;gap:8px}
    .logo span{background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .back-btn{color:var(--text-secondary);text-decoration:none;font-size:14px;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;transition:all .2s}
    .back-btn:hover{color:var(--text-primary);background:var(--bg-card)}

    .post-header{max-width:760px;margin:0 auto;padding:64px 24px 40px;border-bottom:1px solid var(--border)}
    .post-title{font-size:clamp(26px,4vw,40px);font-weight:700;letter-spacing:-1px;line-height:1.2;margin-bottom:16px}
    .post-meta{display:flex;align-items:center;gap:16px;color:var(--text-muted);font-size:13px;flex-wrap:wrap;margin-bottom:16px}
    .post-meta span{display:flex;align-items:center;gap:5px}
    .post-tags{display:flex;gap:8px;flex-wrap:wrap}
    .post-tag{font-size:12px;color:var(--accent);background:rgba(110,231,183,.08);border:1px solid rgba(110,231,183,.15);padding:4px 12px;border-radius:100px;cursor:pointer;transition:all .2s;text-decoration:none}
    .post-tag:hover{background:rgba(110,231,183,.15);border-color:rgba(110,231,183,.3)}

    .post-content{max-width:760px;margin:0 auto;padding:48px 24px}
    .post-content h2{font-size:22px;font-weight:700;letter-spacing:-.5px;color:var(--text-primary);margin:48px 0 16px;padding-left:16px;border-left:3px solid var(--accent)}
    .post-content h3{font-size:18px;font-weight:600;color:var(--text-primary);margin:32px 0 12px}
    .post-content p{color:var(--text-secondary);margin-bottom:20px}
    .post-content strong{color:var(--text-primary);font-weight:600}
    .post-content ul,.post-content ol{color:var(--text-secondary);padding-left:24px;margin-bottom:20px}
    .post-content li{margin-bottom:8px}
    .post-content blockquote{border-left:3px solid var(--accent-2);padding:16px 20px;margin:24px 0;background:rgba(129,140,248,.05);border-radius:0 8px 8px 0;color:var(--text-secondary);font-style:italic}
    .post-content code{background:rgba(255,255,255,.06);border:1px solid var(--border);padding:2px 6px;border-radius:4px;font-size:14px;font-family:'Fira Code',monospace;color:var(--accent)}
    .post-content pre{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;margin:24px 0;overflow-x:auto}
    .post-content pre code{background:none;border:none;padding:0;font-size:14px;color:var(--text-secondary)}
    .post-content hr{border:none;border-top:1px solid var(--border);margin:40px 0}

    /* 警告框 */
    .warning-box{background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.2);border-radius:12px;padding:16px 20px;margin:24px 0;display:flex;gap:12px;align-items:flex-start}
    .warning-box .icon{font-size:18px;flex-shrink:0;margin-top:2px}
    .warning-box p{color:#fca5a5;margin:0;font-size:14px;line-height:1.7}

    /* 提示框 */
    .tip-box{background:rgba(110,231,183,.06);border:1px solid rgba(110,231,183,.2);border-radius:12px;padding:16px 20px;margin:24px 0;display:flex;gap:12px;align-items:flex-start}
    .tip-box .icon{font-size:18px;flex-shrink:0;margin-top:2px}
    .tip-box p{color:#86efac;margin:0;font-size:14px;line-height:1.7}

    /* 步骤块 */
    .step-list{display:flex;flex-direction:column;gap:12px;margin:24px 0}
    .step-item{display:flex;gap:16px;align-items:flex-start}
    .step-num{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#000;flex-shrink:0;margin-top:2px}
    .step-text{color:var(--text-secondary);font-size:15px;line-height:1.7;padding-top:2px}
    .step-text strong{color:var(--text-primary)}

    /* 评论区 */
    .comments-section{max-width:760px;margin:0 auto;padding:0 24px 64px}
    .comments-header{border-top:1px solid var(--border);padding:40px 0 24px;display:flex;align-items:center;justify-content:space-between}
    .comments-title{font-size:16px;font-weight:600;color:var(--text-primary)}
    .comment-link{text-decoration:none;color:var(--accent);font-size:13px;display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border:1px solid rgba(110,231,183,.2);border-radius:8px;transition:all .2s}
    .comment-link:hover{background:rgba(110,231,183,.08)}
    .no-comments{text-align:center;padding:32px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;color:var(--text-muted);font-size:14px}

    /* 文章导航 */
    .post-nav{max-width:760px;margin:0 auto;padding:0 24px 64px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .post-nav-item{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;text-decoration:none;transition:all .2s}
    .post-nav-item:hover{border-color:var(--border-hover);transform:translateY(-2px)}
    .post-nav-label{font-size:11px;color:var(--text-muted);margin-bottom:6px;letter-spacing:.5px}
    .post-nav-title{font-size:14px;font-weight:500;color:var(--text-primary)}

    footer{border-top:1px solid var(--border);padding:32px 24px;text-align:center;color:var(--text-muted);font-size:13px}
    footer a{color:var(--accent);text-decoration:none}
    ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  </style>
</head>
<body>
